name: Publikacja GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Walidacja i budowanie
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdź dane JSON
        run: python3 scripts/validate.py
      - name: Testy
        run: python3 -m unittest discover -s tests -v
      - name: Zbuduj dist
        run: python3 scripts/build.py
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Przekaż pliki witryny
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Wdróż witrynę
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikuj GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
